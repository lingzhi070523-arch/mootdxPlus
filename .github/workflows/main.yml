name: Test Stock Data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mootdxPlus
        run: pip install "git+https://github.com/BiomancerGame/mootdxPlus.git"
      - name: Test TDX protocol
        run: |
          python - <<'PY'
          from mootdx.quotes import Quotes
          client = Quotes.factory(
              market="std",
              server=("110.41.147.114", 7709),
              bestip=False,
              timeout=5,
              heartbeat=False,
              auto_retry=False,
              raise_exception=True
          )
          try:
              print("开始测试通达信协议")
              result = client.stock_count(market=0)
              print("协议请求成功，股票数量:", result)
          finally:
              client.close()
          PY
